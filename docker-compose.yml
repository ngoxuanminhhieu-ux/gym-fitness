networks:
  frontend-network:
    driver: bridge
  backend-network:
    internal: true

volumes:
  mysql_data:
  nginx_logs:
  grafana_data:

services:
  gym-app:
    build: ./app
    container_name: gym-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_USER: gym_user
      DB_PASSWORD: GymSecurePass@2026
      DB_NAME: gym_db
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass@2026
      MYSQL_DATABASE: gym_db
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: GymSecurePass@2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gym-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - mysql-db

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-network
    depends_on:
      - gym-app

  # --- CÁC DỊCH VỤ GIÁM SÁT (COMMIT 2) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: gym-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - frontend-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: gym-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - frontend-network

  grafana:
    image: grafana/grafana:latest
    container_name: gym-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=AdminSecurePass@2026
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend-network
    depends_on:
      - prometheus