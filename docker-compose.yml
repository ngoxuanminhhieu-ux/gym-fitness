networks:
  frontend-network:
    driver: bridge
  backend-network:
    internal: true # Hardening: cô lập database không cho public ra ngoài host

volumes:
  mysql_data:
  nginx_logs:

services:
  gym-app:
    build: ./app
    container_name: gym-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql-db
      DB_USER: gym_user
      DB_PASSWORD: GymSecurePass@2026
      DB_NAME: gym_db
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - mysql-db

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass@2026
      MYSQL_DATABASE: gym_db
      MYSQL_USER: gym_user
      MYSQL_PASSWORD: GymSecurePass@2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: gym-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - mysql-db

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-network
    depends_on:
      - gym-app